name: Branch 10 Browser Playtest
# trigger final Branch 10 evidence
on:
  push:
    branches: [branch-10-regions-5-8]
    paths: ['.github/workflows/branch10-playtest.yml']
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/crown-preview.log 2>&1 &
          for i in {1..30}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/crown-preview.log; exit 1
      - name: Install ephemeral browser runtime
        run: npm exec --yes --package=playwright@1.55.0 -- playwright install chromium
      - name: Run Branch 10 regions playtest
        run: |
          PW_PACKAGE=$(find ~/.npm/_npx -path '*/node_modules/playwright/package.json' | head -n1)
          test -n "$PW_PACKAGE"
          PW_MODULES=$(dirname "$(dirname "$PW_PACKAGE")")
          NODE_PATH="$PW_MODULES" PLAYTEST_URL=http://127.0.0.1:4173/ node tests/e2e/branch10-regions-5-8.cjs
      - name: Run Branch 9 regression path
        run: |
          PW_PACKAGE=$(find ~/.npm/_npx -path '*/node_modules/playwright/package.json' | head -n1)
          PW_MODULES=$(dirname "$(dirname "$PW_PACKAGE")")
          NODE_PATH="$PW_MODULES" PLAYTEST_URL=http://127.0.0.1:4173/ node tests/e2e/branch9-regions-2-4.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch10-playtest-evidence
          path: test-artifacts/branch10/*.png
          if-no-files-found: ignore

name: Branch 9 UI Integration
# presentation patch rerun after escaping nested template literals
on:
  push:
    branches: [branch-9-regions-2-4]
    paths: ['.github/workflows/branch9-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: branch-9-regions-2-4 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Make generated renderer source template-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/branch9-ui-patch.mjs')
          s=p.read_text()
          replacements={
            "\\${res.won?`Zu \\${r.bossName}`:'Nochmal versuchen'}":"\\${res.won?'Zu '+r.bossName:'Nochmal versuchen'}",
            "\\${res.won?`\\${r.bossName} wurde mit Sprache besiegt.`:'Lernfortschritt bleibt erhalten. Die finale Bossaufgabe muss korrekt sein.'}":"\\${res.won?r.bossName+' wurde mit Sprache besiegt.':'Lernfortschritt bleibt erhalten. Die finale Bossaufgabe muss korrekt sein.'}",
            "\\${state.region24Feedback.correct?'+3 Wortkraft':`Richtig wäre: \\${state.region24Feedback.expected}`}":"\\${state.region24Feedback.correct?'+3 Wortkraft':'Richtig wäre: '+state.region24Feedback.expected}",
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing template fix: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: node --check scripts/branch9-ui-patch.mjs
      - run: node scripts/branch9-ui-patch.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'feat: integrate playable regions 2-4'
          git push origin HEAD:branch-9-regions-2-4

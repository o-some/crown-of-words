name: Branch 9 UI Integration
# robust working-copy fix for nested renderer templates
on:
  push:
    branches: [branch-9-regions-2-4]
    paths: ['.github/workflows/branch9-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: branch-9-regions-2-4 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Make generated renderer source template-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/branch9-ui-patch.mjs')
          s=p.read_text()
          s=s.replace('`Zu \\${r.bossName}`', "'Zu '+r.bossName")
          s=s.replace('`\\${r.bossName} wurde mit Sprache besiegt.`', "r.bossName+' wurde mit Sprache besiegt.'")
          s=s.replace('`Richtig wäre: \\${state.region24Feedback.expected}`', "'Richtig wäre: '+state.region24Feedback.expected")
          p.write_text(s)
          PY
      - run: node --check scripts/branch9-ui-patch.mjs
      - run: node scripts/branch9-ui-patch.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'feat: integrate playable regions 2-4'
          git push origin HEAD:branch-9-regions-2-4

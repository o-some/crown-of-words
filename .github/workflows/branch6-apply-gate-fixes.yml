name: Branch 6 Gate Fixes
# retrigger after narrowing the guarded boot-state patch
on:
  push:
    branches:
      - branch-6-playbrain-visual-gate
    paths:
      - '.github/workflows/branch6-apply-gate-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-6-playbrain-visual-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/branch6-apply-gate-fixes.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'fix: make vertical slice reload and pause safe'
          git push origin HEAD:branch-6-playbrain-visual-gate

          for a in assets:
            if a['id'] not in ids: d['assets'].append(a)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - run: node scripts/check-assets.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .masterbrain/asset-registry.json
          git commit -m 'assets: register canonical regions 2-4 assets'
          git push origin HEAD:branch-9-regions-2-4

            dict(id='world-sun-bay',kind='region-background',status='ready',runtimePath='public/assets/worlds/world-sun-bay.webp',dropboxPath='/[LinguaTurtle]/03_Bilder_und_Design/02_Backgrounds/Web/Worlds/world_sun_bay.webp',dropboxFileId='id:tBVq8LNbZ_8AAAAAAAIAQw',dropboxContentHash='0c45304058f73676ecc89b680f06cfacbbfbf35b77657e7c5f5e9245f76b57e4',size=271774,sha256='c16847b0211f44e305dcc5d5122ec33e9fe48706f01262e2d115d5ae1a0b5cda'),
            dict(id='boss-02-kapitaen-brax',kind='boss',status='ready',runtimePath='public/assets/bosses/boss-02-kapitaen-brax.png',dropboxPath='/[LinguaTurtle]/[Endbosse]/Tulas_Island_10_Original_Bosse_Einzeln_v2/[Freigestellt]/Level 2 - Kapitän Brax.png',dropboxFileId='id:tBVq8LNbZ_8AAAAAAAM3bA',dropboxContentHash='8071108deaac29401fadd2b916ef8a3aeb4157fb67d31f9a6edcb9334b42e5fc',size=649171,sha256='82966b1e2a8b1b9a5d3b547edaf1657d160fe9e40965d7858d8be0db25c95632',transparent=True),

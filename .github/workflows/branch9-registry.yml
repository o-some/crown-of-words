name: Branch 9 Asset Registry
on:
  push:
    branches: [branch-9-regions-2-4]
    paths: ['.github/workflows/branch9-registry.yml']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: branch-9-regions-2-4 }
      - name: Register exact canonical assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.masterbrain/asset-registry.json')
          d=json.loads(p.read_text())
          d['branch']='branch-9-regions-2-4'
          ids={a['id'] for a in d['assets']}
          assets=[
            dict(id='world-library',kind='region-background',status='ready',runtimePath='public/assets/worlds/world-library.webp',dropboxPath='/[LinguaTurtle]/03_Bilder_und_Design/02_Backgrounds/Web/Worlds/world_library.webp',dropboxFileId='id:tBVq8LNbZ_8AAAAAAAIIkg',dropboxContentHash='37a3570d672421cd916f8365fd9e08b7fc55265710e9748e8c3a574479841ab9',size=366266,sha256='c19b212b0f7fa0ba4010d9693c0a663c28e372e890d6a3e206c49c970e30a574'),

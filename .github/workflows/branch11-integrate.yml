name: Branch 11 Integration
# trigger corrected guarded integration
on:
  push:
    branches: [branch-11-harbor-castle-finale]
    paths: ['.github/workflows/branch11-integrate.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/branch11-prep-patch.mjs
      - run: node scripts/branch11-integrate.mjs
      - run: npm run check:syntax
      - run: npm run check:assets
      - run: npm run test:finale
      - name: Commit guarded integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css package.json .github/workflows/ci.yml .masterbrain/asset-registry.json
          git commit -m 'feat: expose harbor castle and final campaign'
          git push

name: Branch 10 Asset Import
# pinned public Tula runtime sources only
on:
  push:
    branches: [branch-10-regions-5-8]
    paths: ['.github/workflows/branch10-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Branch 10 runtime assets
        run: |
          set -euo pipefail
          mkdir -p public/assets/worlds public/assets/bosses docs
          WORLD_BASE='https://raw.githubusercontent.com/o-some/tulasisland/cf2fb9b3e2dc1eb885d50e88593124def1cbbdc0/assets/creative'
          BOSS_BASE='https://raw.githubusercontent.com/o-some/word-scramble/ac594046c99ac63954164fe6da0a89ff92c29cf4/assets/bosses'
          curl -fL "$WORLD_BASE/world_coral_reef.webp" -o public/assets/worlds/world-coral-reef.webp
          curl -fL "$WORLD_BASE/world_crystal_cove.webp" -o public/assets/worlds/world-crystal-cove.webp
          curl -fL "$WORLD_BASE/world_desert_oasis.webp" -o public/assets/worlds/world-desert-oasis.webp
          curl -fL "$WORLD_BASE/world_ice_peak.webp" -o public/assets/worlds/world-ice-peak.webp
          curl -fL "$BOSS_BASE/level-05-piratenbaron-vargas.webp" -o public/assets/bosses/boss-05-vargas.webp
          curl -fL "$BOSS_BASE/level-06-kapitaen-ironhook.webp" -o public/assets/bosses/boss-06-ironhook.webp
          curl -fL "$BOSS_BASE/level-07-admiral-thorne.webp" -o public/assets/bosses/boss-07-thorne.webp
          curl -fL "$BOSS_BASE/level-08-kartenmeister-corvin.webp" -o public/assets/bosses/boss-08-corvin.webp
          test "$(stat -c%s public/assets/worlds/world-coral-reef.webp)" = 473394
          test "$(stat -c%s public/assets/worlds/world-crystal-cove.webp)" = 370588
          test "$(stat -c%s public/assets/worlds/world-desert-oasis.webp)" = 386840
          test "$(stat -c%s public/assets/worlds/world-ice-peak.webp)" = 378706
          test "$(stat -c%s public/assets/bosses/boss-05-vargas.webp)" = 152314
          test "$(stat -c%s public/assets/bosses/boss-06-ironhook.webp)" = 138660
          test "$(stat -c%s public/assets/bosses/boss-07-thorne.webp)" = 160626
          test "$(stat -c%s public/assets/bosses/boss-08-corvin.webp)" = 132080
          sha256sum public/assets/worlds/world-coral-reef.webp public/assets/worlds/world-crystal-cove.webp public/assets/worlds/world-desert-oasis.webp public/assets/worlds/world-ice-peak.webp public/assets/bosses/boss-05-vargas.webp public/assets/bosses/boss-06-ironhook.webp public/assets/bosses/boss-07-thorne.webp public/assets/bosses/boss-08-corvin.webp > docs/BRANCH_10_ASSET_SHA256.txt
      - name: Commit verified Branch 10 runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/worlds public/assets/bosses docs/BRANCH_10_ASSET_SHA256.txt
          git commit -m 'assets: import pinned regions 5-8 runtimes'
          git push

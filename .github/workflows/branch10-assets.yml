name: Branch 10 Asset Import
# isolate public worlds and Vargas raw transfer
on:
  push:
    branches: [branch-10-regions-5-8]
    paths: ['.github/workflows/branch10-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public canonical worlds
        run: |
          set -euo pipefail
          mkdir -p public/assets/worlds public/assets/bosses docs
          BASE='https://raw.githubusercontent.com/o-some/tulasisland/cf2fb9b3e2dc1eb885d50e88593124def1cbbdc0/assets/creative'
          curl -fL "$BASE/world_coral_reef.webp" -o public/assets/worlds/world-coral-reef.webp
          curl -fL "$BASE/world_crystal_cove.webp" -o public/assets/worlds/world-crystal-cove.webp
          curl -fL "$BASE/world_desert_oasis.webp" -o public/assets/worlds/world-desert-oasis.webp
          curl -fL "$BASE/world_ice_peak.webp" -o public/assets/worlds/world-ice-peak.webp
          test "$(stat -c%s public/assets/worlds/world-coral-reef.webp)" = 473394
          test "$(stat -c%s public/assets/worlds/world-crystal-cove.webp)" = 370588
          test "$(stat -c%s public/assets/worlds/world-desert-oasis.webp)" = 386840
          test "$(stat -c%s public/assets/worlds/world-ice-peak.webp)" = 378706
      - name: Fetch Vargas original in raw mode
        run: |
          set -euo pipefail
          curl -fL 'https://www.dropbox.com/pri/get/%5BLinguaTurtle%5D/%5BEndbosse%5D/Tulas_Island_10_Original_Bosse_Einzeln_v2/%5BFreigestellt%5D/Level%205%20-%20Piratenbaron%20Vargas.png?_subject_uid=2152286515&w=AADdP5uK7N4mq2muIdutAiJklAEVf2s7JC1atXjoQuRODg&raw=1' -o public/assets/bosses/boss-05-vargas.png
          file public/assets/bosses/boss-05-vargas.png
          stat -c%s public/assets/bosses/boss-05-vargas.png
          test "$(stat -c%s public/assets/bosses/boss-05-vargas.png)" = 750585
      - name: Commit verified partial import
        run: |
          sha256sum public/assets/worlds/*.webp public/assets/bosses/boss-05-vargas.png > docs/BRANCH_10_ASSET_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/worlds public/assets/bosses/boss-05-vargas.png docs/BRANCH_10_ASSET_SHA256.txt
          git commit -m 'assets: import verified Branch 10 worlds and Vargas'
          git push

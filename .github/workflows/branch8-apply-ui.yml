name: Branch 8 UI Patch
# rerun through guarded wrapper after precise standard-result targeting
on:
  push:
    branches:
      - branch-8-enemy-ai
    paths:
      - '.github/workflows/branch8-apply-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-8-enemy-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/branch8-ui-patch-run.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'feat: integrate visible Niko enemy turn'
          git push origin HEAD:branch-8-enemy-ai

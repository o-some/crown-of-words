name: Branch 12 Integration Patch
# trigger guarded host integration
on:
  push:
    branches: [branch-12-host-integration]
    paths: ['.github/workflows/branch12-integrate.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/branch12-integrate.mjs
      - run: node --check src/main.js
      - run: node --test src/adapters/tulas-island-host.test.mjs
      - run: npm test
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire Crown runtime to host adapter boundaries"
          git push origin HEAD:branch-12-host-integration

name: Temporary Kai Import
on:
  push:
    branches:
      - branch-5-garden-kai-vertical-slice
    paths:
      - '.github/workflows/import-kai-temp.yml'
permissions:
  contents: write
jobs:
  import-kai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-5-garden-kai-vertical-slice
      - name: Download verified Kai sprite
        run: |
          set -euo pipefail
          mkdir -p public/assets/bosses docs
          curl --fail --location --silent --show-error 'https://uc57e2c174896d4cf2c74f70b341.dl.dropboxusercontent.com/cd/0/get/DG8eBBES_345gWxM8aAB8jaLmXhM8qjLg_ivAg4A4KSuSNGyEHGOTAHkh8fKPhemQfKVwHGQiPUM7w9aAv4fcfAjBhbrMiU657qvyZ7KSnmfWkpYGA2vPOv2VtL5LOjPB-kdaoKDwClddhrQzc5qeOTMhxbgkCdamL_bS-rlPpX7gA/file?c_luid=88361d58' -o public/assets/bosses/pirat-kai.png
          test "$(wc -c < public/assets/bosses/pirat-kai.png)" -eq 655568
          sha256sum public/assets/bosses/pirat-kai.png | tee docs/BRANCH_5_KAI_SHA256.txt
      - name: Commit Kai asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/bosses/pirat-kai.png docs/BRANCH_5_KAI_SHA256.txt
          git commit -m 'assets: import verified Pirat Kai sprite'
          git push origin HEAD:branch-5-garden-kai-vertical-slice

name: Branch 7 Visual Polish
# second commit triggers this feature-branch workflow after registration
on:
  push:
    branches:
      - branch-7-cards-helpers
    paths:
      - '.github/workflows/branch7-visual-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-7-cards-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/branch7-visual-polish.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'fix: improve Branch 7 loadout readability'
          git push origin HEAD:branch-7-cards-helpers

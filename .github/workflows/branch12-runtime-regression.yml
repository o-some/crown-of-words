name: Branch 12 Runtime Regression
# trigger standalone adapter regression
on:
  push:
    branches: [branch-12-host-integration]
    paths: ['.github/workflows/branch12-runtime-regression.yml']
permissions:
  contents: read
jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/crown-preview.log 2>&1 &
      - run: |
          for i in {1..30}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/crown-preview.log; exit 1
      - run: npm exec --yes --package=playwright@1.55.0 -- playwright install chromium
      - name: Run finale standalone regression
        run: |
          PW_PACKAGE=$(find ~/.npm/_npx -path '*/node_modules/playwright/package.json' | head -n1)
          PW_MODULES=$(dirname "$(dirname "$PW_PACKAGE")")
          NODE_PATH="$PW_MODULES" PLAYTEST_URL=http://127.0.0.1:4173/ node tests/e2e/branch11-harbor-castle.cjs

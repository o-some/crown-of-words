name: Crown of Words CI

on:
  push:
    branches:
      - main
      - 'branch-*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit dependency lock for scaffold branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/branch-1-contracts-scaffold'
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock scaffold dependencies'
            git push origin HEAD:branch-1-contracts-scaffold
          fi
      - name: Syntax check
        run: npm run check:syntax
      - name: Production build
        run: npm run build

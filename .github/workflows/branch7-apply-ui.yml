name: Branch 7 UI Patch
# run the guarded wrapper so generated template literals stay literal until runtime
on:
  push:
    branches:
      - branch-7-cards-helpers
    paths:
      - '.github/workflows/branch7-apply-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-7-cards-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/branch7-run-ui-patch.mjs
      - run: node --check src/main.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'feat: integrate cards and helpers into garden slice'
          git push origin HEAD:branch-7-cards-helpers

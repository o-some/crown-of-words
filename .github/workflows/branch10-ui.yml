name: Branch 10 UI Patch
# trigger guarded integration
on:
  push:
    branches: [branch-10-regions-5-8]
    paths: ['.github/workflows/branch10-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/branch10-ui-patch.mjs
      - run: node --check src/main.js
      - name: Commit guarded UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css
          git commit -m 'feat: expose regions 5-8 and boss telegraphs'
          git push

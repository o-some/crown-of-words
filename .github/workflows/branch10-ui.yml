name: Branch 10 UI Patch
# trigger complete guarded integration
on:
  push:
    branches: [branch-10-regions-5-8]
    paths: ['.github/workflows/branch10-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/branch10-ui-patch.mjs
      - run: node --check src/main.js
      - run: node --check src/content/regions-5-8.js
      - run: node scripts/check-assets.mjs
      - name: Commit guarded Branch 10 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/styles.css src/content/regions-5-8.js .masterbrain/asset-registry.json
          git commit -m 'feat: expose regions 5-8 with verified assets and telegraphs'
          git push
